<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Safia — Vizual Tekshirish va Standartlar Paneli</title>
  <style>
    :root {
      --primary: #8b1e2d;
      --primary-hover: #701622;
      --accent: #d4a359;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --border: #e2e8f0;
      --text: #1e293b;
      --text-muted: #64748b;
      --danger: #dc2626;
      --danger-bg: #fef2f2;
      --success: #16a34a;
      --success-bg: #f0fdf4;
      --badge-bg: #f1f5f9;
      --radius: 12px;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding-bottom: 60px;
    }

    /* HEADER & NAV */
    header {
      background: linear-gradient(135deg, #701622 0%, #8b1e2d 50%, #9e2a3b 100%);
      color: white;
      padding: 20px 24px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 20px rgba(139, 30, 45, 0.25);
    }

    .header-container {
      max-width: 1300px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      background: var(--accent);
      color: #8b1e2d;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 22px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    .brand-text h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .brand-text p {
      font-size: 13px;
      opacity: 0.85;
    }

    /* TABS */
    .tabs-nav {
      display: flex;
      background: rgba(0, 0, 0, 0.2);
      padding: 4px;
      border-radius: 10px;
      gap: 4px;
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.85);
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tab-btn:hover {
      color: white;
      background: rgba(255, 255, 255, 0.1);
    }

    .tab-btn.active {
      background: white;
      color: var(--primary);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }

    .tab-count {
      background: rgba(139, 30, 45, 0.15);
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 12px;
    }

    .tab-btn.active .tab-count {
      background: rgba(139, 30, 45, 0.12);
      color: var(--primary);
    }

    /* MAIN CONTAINER */
    .container {
      max-width: 1300px;
      margin: 24px auto;
      padding: 0 20px;
    }

    /* CONTROL & SUMMARY BAR */
    .control-panel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
      margin-bottom: 24px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .stats-row {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px dashed var(--border);
      padding-bottom: 14px;
    }

    .stat-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .stat-pill {
      background: var(--badge-bg);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
    }

    .stat-pill strong {
      color: var(--text);
    }

    .stat-pill.success {
      background: var(--success-bg);
      color: var(--success);
    }

    .stat-pill.danger {
      background: var(--danger-bg);
      color: var(--danger);
    }

    .progress-bar-wrap {
      flex: 1;
      min-width: 180px;
      max-width: 300px;
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 4px;
      color: var(--text-muted);
    }

    .progress-bg {
      height: 8px;
      background: #e2e8f0;
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--success);
      width: 0%;
      transition: width 0.3s ease;
    }

    .filters-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }

    .search-box {
      flex: 1;
      min-width: 220px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 10px 14px 10px 38px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border 0.2s;
    }

    .search-box input:focus {
      border-color: var(--primary);
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }

    .filter-select {
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      background: white;
      color: var(--text);
      outline: none;
      cursor: pointer;
    }

    .btn {
      padding: 10px 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: white;
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn:hover {
      background: var(--badge-bg);
    }

    .btn-primary {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    /* GRID & CARDS */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(550px, 1fr));
      gap: 20px;
    }

    @media (max-width: 768px) {
      .cards-grid {
        grid-template-columns: 1fr;
      }
    }

    /* ITEM CARD */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px;
      display: flex;
      gap: 18px;
      position: relative;
      transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
    }

    .card:hover {
      box-shadow: var(--shadow-lg);
      transform: translateY(-2px);
    }

    /* CRITICAL REQUIREMENT: RED BORDER FOR BROKEN IMAGES */
    .card.has-img-error {
      border: 2px solid var(--danger) !important;
      box-shadow: 0 0 12px rgba(220, 38, 38, 0.3) !important;
      background-color: var(--danger-bg);
    }

    .card.is-confirmed {
      border-left: 4px solid var(--success);
    }

    /* IMAGE AREA */
    .img-container {
      width: 170px;
      height: 170px;
      min-width: 170px;
      border-radius: 10px;
      overflow: hidden;
      background: #f1f5f9;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(0,0,0,0.06);
    }

    .img-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      cursor: pointer;
      transition: transform 0.3s;
    }

    .img-container img:hover {
      transform: scale(1.05);
    }

    /* IMAGE ERROR STATE */
    .img-container.img-failed {
      background: #fee2e2;
      border: 1px dashed var(--danger);
    }

    .img-error-placeholder {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 10px;
      color: var(--danger);
      font-size: 12px;
      font-weight: 700;
      gap: 6px;
    }

    .img-container.img-failed .img-error-placeholder {
      display: flex;
    }

    .img-zoom-hint {
      position: absolute;
      bottom: 6px;
      right: 6px;
      background: rgba(0, 0, 0, 0.6);
      color: white;
      font-size: 10px;
      padding: 3px 6px;
      border-radius: 4px;
      pointer-events: none;
      opacity: 0.8;
    }

    /* DETAILS AREA */
    .card-details {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }

    .meta-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    .badge {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .badge-id {
      background: #e0f2fe;
      color: #0369a1;
    }

    .badge-category {
      background: #fef3c7;
      color: #b45309;
    }

    .badge-price {
      background: #dcfce7;
      color: #15803d;
      font-weight: 800;
    }

    .card-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.3;
    }

    .ingredients-box {
      background: #f8fafc;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid #edf2f7;
      font-size: 12.5px;
      line-height: 1.4;
      color: #334155;
    }

    .serving-box {
      background: #fffbe8;
      border: 1px solid #fef08a;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      color: #854d0e;
    }

    /* BADGES (TAGS & ALLERGENS) */
    .pills-group {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 2px;
    }

    .pill-allergen {
      background: #fee2e2;
      color: #991b1b;
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 4px;
      font-weight: 600;
    }

    .pill-tag {
      background: #e0e7ff;
      color: #3730a3;
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 4px;
      font-weight: 600;
    }

    .pill-spicy {
      background: #fef2f2;
      color: #dc2626;
      font-weight: 700;
    }

    .pill-meatless {
      background: #f0fdf4;
      color: #16a34a;
      font-weight: 700;
    }

    /* CONFIRMATION TOGGLE BUTTON */
    .confirm-wrapper {
      margin-top: auto;
      padding-top: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--border);
    }

    .confirm-btn-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
      transition: color 0.2s;
    }

    .confirm-btn-label:hover {
      color: var(--text);
    }

    .confirm-checkbox {
      width: 18px;
      height: 18px;
      accent-color: var(--success);
      cursor: pointer;
    }

    .card.is-confirmed .confirm-btn-label {
      color: var(--success);
    }

    .confirmed-badge {
      display: none;
      align-items: center;
      gap: 4px;
      background: var(--success-bg);
      color: var(--success);
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 700;
    }

    .card.is-confirmed .confirmed-badge {
      display: inline-flex;
    }

    /* STANDARTS STYLING */
    .standards-container {
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .standards-section {
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
    }

    .section-title-box {
      border-bottom: 2px solid var(--primary);
      padding-bottom: 10px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .section-title-box h2 {
      color: var(--primary);
      font-size: 20px;
    }

    .section-title-box span {
      font-size: 14px;
      color: var(--text-muted);
    }

    .std-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
      font-size: 14px;
    }

    .std-table th, .std-table td {
      padding: 12px 14px;
      border: 1px solid var(--border);
      text-align: left;
    }

    .std-table th {
      background: #f8fafc;
      font-weight: 700;
      color: var(--text);
    }

    .grid-2col {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 16px;
    }

    .info-card {
      background: #f8fafc;
      border: 1px solid var(--border);
      padding: 16px;
      border-radius: 8px;
    }

    .info-card h4 {
      color: var(--primary);
      margin-bottom: 8px;
      font-size: 15px;
    }

    /* LIGHTBOX MODAL */
    .lightbox-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 20px;
    }

    .lightbox-modal.active {
      display: flex;
    }

    .lightbox-modal img {
      max-width: 90vw;
      max-height: 80vh;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .lightbox-caption {
      color: white;
      margin-top: 14px;
      font-size: 16px;
      font-weight: 600;
      text-align: center;
    }

    .lightbox-close {
      position: absolute;
      top: 20px;
      right: 24px;
      color: white;
      font-size: 32px;
      cursor: pointer;
      line-height: 1;
    }

    .empty-state {
      grid-column: 1 / -1;
      background: white;
      padding: 40px;
      text-align: center;
      border-radius: var(--radius);
      border: 1px dashed var(--border);
      color: var(--text-muted);
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="header-container">
      <div class="brand">
        <div class="brand-icon">S</div>
        <div class="brand-text">
          <h1>Safia — Vizual Tekshirish Paneli</h1>
          <p>Oshxona, Bar taomlari hamda Servis standartlari</p>
        </div>
      </div>

      <!-- TABS -->
      <nav class="tabs-nav">
        <button class="tab-btn active" id="tab-dishes-btn" onclick="switchTab('dishes')">
          <span>Oshxona</span>
          <span class="tab-count" id="count-dishes-badge">0</span>
        </button>
        <button class="tab-btn" id="tab-drinks-btn" onclick="switchTab('drinks')">
          <span>Bar</span>
          <span class="tab-count" id="count-drinks-badge">0</span>
        </button>
        <button class="tab-btn" id="tab-standards-btn" onclick="switchTab('standards')">
          <span>Standartlar</span>
        </button>
      </nav>
    </div>
  </header>

  <main class="container">

    <!-- CONTROL PANEL & STATS -->
    <div class="control-panel" id="control-panel">
      <!-- STATS ROW -->
      <div class="stats-row">
        <div class="stat-pills">
          <div class="stat-pill">
            <span>Jami elementlar:</span>
            <strong id="stat-total">0</strong>
          </div>
          <div class="stat-pill success">
            <span>✓ Tasdiqlandi:</span>
            <strong id="stat-confirmed">0</strong>
          </div>
          <div class="stat-pill danger">
            <span>⚠️ Rasmda xatolik:</span>
            <strong id="stat-errors">0</strong>
          </div>
        </div>

        <div class="progress-bar-wrap">
          <div class="progress-info">
            <span>Tasdiqlash jarayoni:</span>
            <span id="progress-percent">0%</span>
          </div>
          <div class="progress-bg">
            <div class="progress-fill" id="progress-fill"></div>
          </div>
        </div>
      </div>

      <!-- FILTERS ROW -->
      <div class="filters-row">
        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input type="text" id="search-input" placeholder="Nomi, ID yoki tarkib bo'yicha qidirish..." oninput="applyFilters()">
        </div>

        <select class="filter-select" id="category-filter" onchange="applyFilters()">
          <option value="">Barcha kategoriyalar</option>
        </select>

        <select class="filter-select" id="status-filter" onchange="applyFilters()">
          <option value="all">Barcha holatlar</option>
          <option value="confirmed">Faqat tasdiqlanganlar</option>
          <option value="unconfirmed">Faqat tasdiqlanmaganlar</option>
          <option value="error">⚠️ Faqat rasm xatoliklari</option>
        </select>

        <button class="btn" onclick="toggleConfirmAllCurrentTab()">
          <span>✓ Sahifani tasdiqlash</span>
        </button>

        <button class="btn" onclick="resetFilters()">
          <span>🔄 Filtrni tozalash</span>
        </button>
      </div>
    </div>

    <!-- DISHES TAB GRID -->
    <section id="dishes-section" class="cards-grid"></section>

    <!-- DRINKS TAB GRID -->
    <section id="drinks-section" class="cards-grid hidden"></section>

    <!-- STANDARDS TAB SECTION -->
    <section id="standards-section" class="standards-container hidden"></section>

  </main>

  <!-- LIGHTBOX MODAL -->
  <div class="lightbox-modal" id="lightbox-modal" onclick="closeLightbox()">
    <span class="lightbox-close">&times;</span>
    <img id="lightbox-img" src="" alt="Zoom image">
    <div class="lightbox-caption" id="lightbox-caption"></div>
  </div>

  <script>
    // GLOBAL STATE
    let dishesData = [];
    let drinksData = [];
    let standardsData = null;

    let currentTab = 'dishes';
    let confirmedItems = JSON.parse(localStorage.getItem('safia_confirmed_v2') || '{}');
    let imageErrorSet = new Set();

    // INITIALIZATION
    document.addEventListener('DOMContentLoaded', async () => {
      await loadAllData();
      renderCurrentTab();
    });

    async function loadAllData() {
      try {
        const [dishesRes, drinksRes, standardsRes] = await Promise.all([
          fetch('data/dishes.json').then(r => r.ok ? r.json() : null),
          fetch('data/drinks.json').then(r => r.ok ? r.json() : null),
          fetch('data/standards.json').then(r => r.ok ? r.json() : null)
        ]);

        dishesData = dishesRes || [];
        drinksData = drinksRes || [];
        standardsData = standardsRes || null;

        document.getElementById('count-dishes-badge').innerText = dishesData.length;
        document.getElementById('count-drinks-badge').innerText = drinksData.length;
      } catch (err) {
        console.error('Data load error:', err);
      }
    }

    // SWITCH TAB
    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById(`tab-${tab}-btn`).classList.add('active');

      const dishesSec = document.getElementById('dishes-section');
      const drinksSec = document.getElementById('drinks-section');
      const stdSec = document.getElementById('standards-section');
      const ctrlPanel = document.getElementById('control-panel');

      dishesSec.classList.add('hidden');
      drinksSec.classList.add('hidden');
      stdSec.classList.add('hidden');

      if (tab === 'dishes') {
        dishesSec.classList.remove('hidden');
        ctrlPanel.classList.remove('hidden');
      } else if (tab === 'drinks') {
        drinksSec.classList.remove('hidden');
        ctrlPanel.classList.remove('hidden');
      } else if (tab === 'standards') {
        stdSec.classList.remove('hidden');
        ctrlPanel.classList.add('hidden');
      }

      populateCategoryFilter();
      applyFilters();
    }

    function renderCurrentTab() {
      renderDishes();
      renderDrinks();
      renderStandards();
      populateCategoryFilter();
      applyFilters();
    }

    // POPULATE CATEGORY DROPDOWN
    function populateCategoryFilter() {
      const select = document.getElementById('category-filter');
      select.innerHTML = '<option value="">Barcha kategoriyalar</option>';

      let categories = new Set();
      if (currentTab === 'dishes') {
        dishesData.forEach(d => d.category && categories.add(d.category));
      } else if (currentTab === 'drinks') {
        drinksData.forEach(d => d.group && categories.add(d.group));
      }

      Array.from(categories).sort().forEach(cat => {
        const opt = document.createElement('option');
        opt.value = cat;
        opt.textContent = cat;
        select.appendChild(opt);
      });
    }

    // RENDER DISHES
    function renderDishes() {
      const container = document.getElementById('dishes-section');
      container.innerHTML = '';

      if (!dishesData || dishesData.length === 0) {
        container.innerHTML = '<div class="empty-state">Oshxona taomlari yuklanmadi yoki maʼlumot topilmadi</div>';
        return;
      }

      dishesData.forEach(item => {
        const itemKey = `dishes-${item.id}`;
        const isConfirmed = !!confirmedItems[itemKey];

        const card = document.createElement('div');
        card.className = `card ${isConfirmed ? 'is-confirmed' : ''}`;
        card.id = `card-${itemKey}`;
        card.dataset.key = itemKey;
        card.dataset.category = item.category || '';
        card.dataset.name = (item.name_ru || '').toLowerCase();
        card.dataset.ingredients = (item.ingredients_ru || '').toLowerCase();
        card.dataset.id = item.id;

        const formattedPrice = item.price_uah ? `${item.price_uah.toLocaleString('ru-RU')} UAH` : '';

        card.innerHTML = `
          <div class="img-container">
            <img src="${item.image}" alt="${escapeHtml(item.name_ru)}"
                 onerror="handleImgError(this, '${itemKey}')"
                 onclick="openLightbox('${item.image}', '${escapeHtml(item.name_ru)}')">
            <div class="img-error-placeholder">
              <span style="font-size: 20px;">⚠️</span>
              <span>Rasm topilmadi</span>
            </div>
            <div class="img-zoom-hint">🔍 Kattalashtirish</div>
          </div>
          <div class="card-details">
            <div class="card-header">
              <div class="meta-badges">
                <span class="badge badge-id">ID: #${String(item.id).padStart(3, '0')}</span>
                <span class="badge badge-category">${escapeHtml(item.category || 'Oshxona')}</span>
                ${formattedPrice ? `<span class="badge badge-price">${formattedPrice}</span>` : ''}
              </div>
            </div>

            <div class="card-title">${escapeHtml(item.name_ru)}</div>

            <div class="ingredients-box">
              <strong>Tarkibi:</strong> ${escapeHtml(item.ingredients_ru || 'Maʼlumot koʻrsatilmagan')}
            </div>

            ${renderTagsAndAllergens(item)}

            <div class="confirm-wrapper">
              <label class="confirm-btn-label">
                <input type="checkbox" class="confirm-checkbox"
                       ${isConfirmed ? 'checked' : ''}
                       onchange="toggleConfirm('${itemKey}', this.checked)">
                <span>Tasdiqlandi</span>
              </label>
              <div class="confirmed-badge">✓ Tasdiqlangan</div>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // RENDER DRINKS
    function renderDrinks() {
      const container = document.getElementById('drinks-section');
      container.innerHTML = '';

      if (!drinksData || drinksData.length === 0) {
        container.innerHTML = '<div class="empty-state">Bar ichimliklari yuklanmadi yoki maʼlumot topilmadi</div>';
        return;
      }

      drinksData.forEach(item => {
        const itemKey = `drinks-${item.id}`;
        const isConfirmed = !!confirmedItems[itemKey];

        const card = document.createElement('div');
        card.className = `card ${isConfirmed ? 'is-confirmed' : ''}`;
        card.id = `card-${itemKey}`;
        card.dataset.key = itemKey;
        card.dataset.category = item.group || '';
        card.dataset.name = (item.name_ru || '').toLowerCase();
        card.dataset.ingredients = (item.ingredients_ru || '').toLowerCase();
        card.dataset.id = item.id;

        card.innerHTML = `
          <div class="img-container">
            <img src="${item.image}" alt="${escapeHtml(item.name_ru)}"
                 onerror="handleImgError(this, '${itemKey}')"
                 onclick="openLightbox('${item.image}', '${escapeHtml(item.name_ru)}')">
            <div class="img-error-placeholder">
              <span style="font-size: 20px;">⚠️</span>
              <span>Rasm topilmadi</span>
            </div>
            <div class="img-zoom-hint">🔍 Kattalashtirish</div>
          </div>
          <div class="card-details">
            <div class="card-header">
              <div class="meta-badges">
                <span class="badge badge-id">ID: #${String(item.id).padStart(3, '0')}</span>
                <span class="badge badge-category">${escapeHtml(item.group || 'Bar')}</span>
              </div>
            </div>

            <div class="card-title">${escapeHtml(item.name_ru)}</div>

            <div class="ingredients-box">
              <strong>Tarkibi:</strong> ${escapeHtml(item.ingredients_ru || 'Maʼlumot koʻrsatilmagan')}
            </div>

            ${item.serving_ru ? `
              <div class="serving-box">
                <strong>Servirovka / Podacha:</strong> ${escapeHtml(item.serving_ru)}
              </div>
            ` : ''}

            ${renderTagsAndAllergens(item)}

            <div class="confirm-wrapper">
              <label class="confirm-btn-label">
                <input type="checkbox" class="confirm-checkbox"
                       ${isConfirmed ? 'checked' : ''}
                       onchange="toggleConfirm('${itemKey}', this.checked)">
                <span>Tasdiqlandi</span>
              </label>
              <div class="confirmed-badge">✓ Tasdiqlangan</div>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // HELPER: RENDER TAGS & ALLERGENS
    function renderTagsAndAllergens(item) {
      let html = '<div class="pills-group">';

      if (item.is_spicy) {
        html += '<span class="pill-tag pill-spicy">🌶️ Ocharli / Spicy</span>';
      }
      if (item.is_meatless) {
        html += '<span class="pill-tag pill-meatless">🌱 Go\'shtga ega emas</span>';
      }

      if (item.tags && Array.isArray(item.tags)) {
        item.tags.forEach(t => {
          html += `<span class="pill-tag">${escapeHtml(t)}</span>`;
        });
      }

      if (item.allergens && Array.isArray(item.allergens) && item.allergens.length > 0) {
        item.allergens.forEach(a => {
          html += `<span class="pill-allergen">⚠️ ${escapeHtml(a)}</span>`;
        });
      }

      html += '</div>';
      return html;
    }

    // IMAGE ERROR HANDLER (CRITICAL REQUIREMENT)
    function handleImgError(imgEl, itemKey) {
      imgEl.style.display = 'none';
      const container = imgEl.parentElement;
      if (container) {
        container.classList.add('img-failed');
      }

      const card = document.getElementById(`card-${itemKey}`);
      if (card) {
        card.classList.add('has-img-error');
      }

      imageErrorSet.add(itemKey);
      updateStats();
    }

    // TOGGLE CONFIRMATION
    function toggleConfirm(itemKey, isChecked) {
      if (isChecked) {
        confirmedItems[itemKey] = true;
      } else {
        delete confirmedItems[itemKey];
      }
      localStorage.setItem('safia_confirmed_v2', JSON.stringify(confirmedItems));

      const card = document.getElementById(`card-${itemKey}`);
      if (card) {
        if (isChecked) {
          card.classList.add('is-confirmed');
        } else {
          card.classList.remove('is-confirmed');
        }
      }

      updateStats();
    }

    function toggleConfirmAllCurrentTab() {
      const activeSection = currentTab === 'dishes' ?
        document.getElementById('dishes-section') :
        document.getElementById('drinks-section');

      const cards = activeSection.querySelectorAll('.card:not(.hidden)');
      let allChecked = true;

      cards.forEach(card => {
        const checkbox = card.querySelector('.confirm-checkbox');
        if (checkbox && !checkbox.checked) {
          allChecked = false;
        }
      });

      const newState = !allChecked;
      cards.forEach(card => {
        const key = card.dataset.key;
        const checkbox = card.querySelector('.confirm-checkbox');
        if (checkbox) {
          checkbox.checked = newState;
          toggleConfirm(key, newState);
        }
      });
    }

    // APPLY FILTERS & SEARCH
    function applyFilters() {
      if (currentTab === 'standards') return;

      const searchVal = document.getElementById('search-input').value.toLowerCase().trim();
      const catVal = document.getElementById('category-filter').value;
      const statusVal = document.getElementById('status-filter').value;

      const activeSection = currentTab === 'dishes' ?
        document.getElementById('dishes-section') :
        document.getElementById('drinks-section');

      const cards = activeSection.querySelectorAll('.card');

      cards.forEach(card => {
        const key = card.dataset.key;
        const name = card.dataset.name;
        const ingredients = card.dataset.ingredients;
        const idStr = card.dataset.id;
        const category = card.dataset.category;

        const isConfirmed = !!confirmedItems[key];
        const isError = imageErrorSet.has(key);

        const matchesSearch = !searchVal ||
          name.includes(searchVal) ||
          ingredients.includes(searchVal) ||
          idStr.includes(searchVal);

        const matchesCat = !catVal || category === catVal;

        let matchesStatus = true;
        if (statusVal === 'confirmed') matchesStatus = isConfirmed;
        if (statusVal === 'unconfirmed') matchesStatus = !isConfirmed;
        if (statusVal === 'error') matchesStatus = isError;

        if (matchesSearch && matchesCat && matchesStatus) {
          card.classList.remove('hidden');
        } else {
          card.classList.add('hidden');
        }
      });

      updateStats();
    }

    function resetFilters() {
      document.getElementById('search-input').value = '';
      document.getElementById('category-filter').value = '';
      document.getElementById('status-filter').value = 'all';
      applyFilters();
    }

    // UPDATE STATS
    function updateStats() {
      if (currentTab === 'standards') return;

      const currentDataset = currentTab === 'dishes' ? dishesData : drinksData;
      const prefix = currentTab;
      const total = currentDataset.length;

      let confirmedCount = 0;
      let errorCount = 0;

      currentDataset.forEach(item => {
        const key = `${prefix}-${item.id}`;
        if (confirmedItems[key]) confirmedCount++;
        if (imageErrorSet.has(key)) errorCount++;
      });

      document.getElementById('stat-total').innerText = total;
      document.getElementById('stat-confirmed').innerText = confirmedCount;
      document.getElementById('stat-errors').innerText = errorCount;

      const percent = total > 0 ? Math.round((confirmedCount / total) * 100) : 0;
      document.getElementById('progress-percent').innerText = `${percent}%`;
      document.getElementById('progress-fill').style.width = `${percent}%`;
    }

    // RENDER STANDARDS TAB
    function renderStandards() {
      const container = document.getElementById('standards-section');
      if (!standardsData || !standardsData.sections) {
        container.innerHTML = '<div class="empty-state">Standartlar maʼlumoti yuklanmagan</div>';
        return;
      }

      let html = '';

      standardsData.sections.forEach(sec => {
        html += `
          <div class="standards-section">
            <div class="section-title-box">
              <h2>${escapeHtml(sec.title_ru)}</h2>
              <span>${escapeHtml(sec.title_uz || '')}</span>
            </div>
        `;

        // Mission / Values
        if (sec.id === 'mission' && sec.content) {
          html += `
            <div class="grid-2col" style="margin-bottom: 20px;">
              <div class="info-card">
                <h4>Миссия (RU):</h4>
                <p><strong>"${escapeHtml(sec.content.mission_ru)}"</strong></p>
                <p style="margin-top: 6px; color: var(--text-muted);">${escapeHtml(sec.content.motto_ru)}</p>
              </div>
              <div class="info-card">
                <h4>Missiya (UZ):</h4>
                <p><strong>"${escapeHtml(sec.content.mission_uz)}"</strong></p>
                <p style="margin-top: 6px; color: var(--text-muted);">${escapeHtml(sec.content.motto_uz)}</p>
              </div>
            </div>
            <h4>Asosiy Qadriyatlar / Ценности:</h4>
            <ul style="margin-left: 20px; margin-top: 8px;">
              ${(sec.content.values || []).map(v => `<li><strong>${escapeHtml(v.title_ru)}</strong> — <em>${escapeHtml(v.title_uz)}</em></li>`).join('')}
            </ul>
          `;
        }

        // Dish Serving Rules Table
        if (sec.rules) {
          html += `
            <table class="std-table">
              <thead>
                <tr>
                  <th>Kategoriya (RU / UZ)</th>
                  <th>Servirovka Qoidasi (RU)</th>
                  <th>Servirovka Qoidasi (UZ)</th>
                </tr>
              </thead>
              <tbody>
                ${sec.rules.map(r => `
                  <tr>
                    <td><strong>${escapeHtml(r.category_ru)}</strong><br><span style="color:var(--text-muted);">${escapeHtml(r.category_uz)}</span></td>
                    <td>${escapeHtml(r.description_ru)}</td>
                    <td>${escapeHtml(r.description_uz)}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          `;
        }

        // Greetings
        if (sec.greetings) {
          html += `
            <div class="grid-2col">
              ${sec.greetings.map(g => `
                <div class="info-card">
                  <h4>${escapeHtml(g.phrase_ru)}</h4>
                  <p><strong>UZ:</strong> ${escapeHtml(g.phrase_uz)}</p>
                  <p style="font-size: 12px; color: var(--text-muted); margin-top: 4px;">EN: ${escapeHtml(g.translation)}</p>
                </div>
              `).join('')}
            </div>
          `;
        }

        // Taking Order
        if (sec.basic_phrases) {
          html += `
            <h4>Tavsiya va savol berish iboralari:</h4>
            <table class="std-table" style="margin-bottom: 16px;">
              <thead>
                <tr><th>RU</th><th>UZ</th></tr>
              </thead>
              <tbody>
                ${sec.basic_phrases.map(b => `
                  <tr><td>${escapeHtml(b.phrase_ru)}</td><td>${escapeHtml(b.phrase_uz)}</td></tr>
                `).join('')}
              </tbody>
            </table>
          `;
        }

        // Serving Stages
        if (sec.stages) {
          html += `
            <div class="grid-2col">
              ${sec.stages.map(st => `
                <div class="info-card">
                  <h4>Bosqich ${st.stage}: ${escapeHtml(st.title_ru)}</h4>
                  <p style="color:var(--text-muted); font-size:13px; margin-bottom:8px;">${escapeHtml(st.title_uz)}</p>
                  <ul>
                    ${(st.actions || []).map(a => `<li>${escapeHtml(a.ru)}</li>`).join('')}
                  </ul>
                </div>
              `).join('')}
            </div>
          `;
        }

        // Staff Roles
        if (sec.roles) {
          html += `
            <div class="grid-2col">
              ${sec.roles.map(rl => `
                <div class="info-card">
                  <h4>Role: ${escapeHtml(rl.role_ru)} (${escapeHtml(rl.role_uz)})</h4>
                  <ul>
                    ${(rl.responsibilities || []).map(res => `<li>${escapeHtml(res.ru)}</li>`).join('')}
                  </ul>
                </div>
              `).join('')}
            </div>
          `;
        }

        html += `</div>`;
      });

      // Allergen information section
      if (standardsData.allergen_information) {
        html += `
          <div class="standards-section">
            <div class="section-title-box">
              <h2>Информация об аллергенах / Allergenlar haqida</h2>
            </div>
            <p style="margin-bottom: 12px;">${escapeHtml(standardsData.allergen_information.description_ru)}</p>
            <div class="pills-group">
              ${(standardsData.allergen_information.common_allergens || []).map(a => `<span class="pill-allergen">⚠️ ${escapeHtml(a)}</span>`).join('')}
            </div>
          </div>
        `;
      }

      container.innerHTML = html;
    }

    // LIGHTBOX FUNCTIONS
    function openLightbox(imgSrc, caption) {
      document.getElementById('lightbox-img').src = imgSrc;
      document.getElementById('lightbox-caption').innerText = caption;
      document.getElementById('lightbox-modal').classList.add('active');
    }

    function closeLightbox() {
      document.getElementById('lightbox-modal').classList.remove('active');
    }

    // UTILS
    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>
</body>
</html>
